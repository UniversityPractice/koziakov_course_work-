# «Флористический центр»: PostgreSQL 16 и настольное приложение (PyQt5).
#
#   docker compose up -d --build   — поднять базу и открыть окно приложения
#   docker compose up -d db        — только база (приложение запускается на хосте: python app/main.py)
#   docker compose run --rm app    — открыть приложение ещё раз после того, как окно закрыли
#   docker compose down -v         — остановить и удалить данные (следующий up создаст базу заново)
#
# База: параметры совпадают с app/config.ini (localhost:5433, florist, postgres/flowers).
# При первом запуске (пустой том) создаётся схема и загружаются тестовые
# и дополнительные данные.
#
# Приложение: окно выводится на X-сервер хоста. По умолчанию — WSLg
# (Windows 10/11 + Docker Desktop на WSL2, ничего ставить не нужно).
# На Linux:  X11_UNIX=/tmp/.X11-unix docker compose up -d --build
#            (и разрешить доступ: xhost +local:docker)

services:
  db:
    image: postgres:16
    container_name: florist-db
    environment:
      POSTGRES_DB: florist
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: flowers
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - florist-data:/var/lib/postgresql/data
      # Скрипты init выполняются по алфавиту имён — номера задают порядок.
      - ./database/флористический_центр.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./database/тестовые_данные.sql:/docker-entrypoint-initdb.d/02_data.sql:ro
      - ./database/дополнительные_данные.sql:/docker-entrypoint-initdb.d/03_more_data.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d florist"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  app:
    build: ./app
    image: florist-app
    container_name: florist-app
    depends_on:
      db:
        condition: service_healthy
    environment:
      # переопределяют app/config.ini: внутри сети compose база — это сервис db
      DB_HOST: db
      DB_PORT: "5432"
      DISPLAY: "${DISPLAY_NUM:-:0}"
    volumes:
      - "${X11_UNIX:-/run/desktop/mnt/host/wslg/.X11-unix}:/tmp/.X11-unix"
    # окно закрыли — контейнер завершился; снова открыть: docker compose run --rm app
    restart: "no"

volumes:
  florist-data:
